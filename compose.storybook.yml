name: ds-tend-ui

services:
  storybook:
    image: ds-rovna-ui-storybook:local
    build:
      context: .
      dockerfile: Dockerfile.storybook
    init: true
    ports:
      - "${ROVNA_UI_STORYBOOK_PORT:-3001}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
