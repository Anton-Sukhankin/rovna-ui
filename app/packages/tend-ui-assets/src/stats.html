<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bundle Analyzer</title>
    <style>
      :root {
        color: #1f2937;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
      }

      main {
        width: min(720px, calc(100% - 48px));
        padding: 64px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 12px;
        color: #4b5563;
        font-size: 16px;
        line-height: 1.55;
      }

      code {
        color: #111827;
        background: #f3f4f6;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Отчет Bundle Analyzer не сформирован</h1>
      <p>Эта локальная страница сохраняет работоспособность документации Storybook без внешних источников.</p>
      <p>Для актуального интерактивного отчета выполните <code>corepack yarn analyze:silent</code> в каталоге <code>app</code> и откройте <code>app/dist/stats.html</code>.</p>
    </main>
  </body>
</html>
