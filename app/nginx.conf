load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes  2;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  gzip            on;
  gzip_static     on;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  brotli            on;
  brotli_static     on;
  brotli_comp_level 6;
  brotli_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  server {
    listen 8080;
    charset utf-8;

    root /web;

    location / {
      try_files $uri /index.html;
    }

    location = /health-web {
      add_header 'Content-Type' 'application/json';
      return 200 '{"status": "OK"}';
    }
  }
}
