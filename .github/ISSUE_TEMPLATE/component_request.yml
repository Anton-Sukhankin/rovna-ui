name: Компонент или улучшение API
description: Предложить новый компонент, состояние или изменение публичного контракта.
title: "[Component]: "
body:
  - type: input
    id: use-case
    attributes:
      label: Пользовательский сценарий
      description: Какую задачу должен решать компонент или изменение?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Текущее решение
      description: Какие Rovna UI компоненты уже рассматривались и почему их недостаточно?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Предлагаемый контракт
      description: Опишите состояния, взаимодействия, accessibility и предполагаемый import path.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Границы
      options:
        - label: Пользовательские тексты будут на русском языке.
          required: true
        - label: Решение не требует закрытых корпоративных источников.
          required: true
        - label: Возможное изменение публичного API отмечено отдельно.
          required: true
