name: Ошибка компонента или Storybook
description: Сообщить о воспроизводимом дефекте Rovna UI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Не добавляйте токены, ключи, персональные данные или сведения об уязвимостях. Для security-случаев следуйте SECURITY.md.
  - type: input
    id: package
    attributes:
      label: Пакет или Storybook group
      placeholder: "@rovna-ui/primitives / Button"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Воспроизведение
      description: Укажите story URL или минимальный локальный сценарий и последовательность действий.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Среда
      multiple: true
      options:
        - Chromium
        - Firefox
        - WebKit
        - Static Storybook
        - Package consumer
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Логи и изображения
      description: Добавьте безопасные фрагменты логов, screenshot или trace без секретов.
