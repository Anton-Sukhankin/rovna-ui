name: Rovna UI quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rovna-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
      npm_config_registry: https://registry.npmjs.org

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock
          registry-url: https://registry.npmjs.org

      - name: Activate Yarn 1
        run: corepack prepare yarn@1.22.15 --activate

      - name: Install public dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive --registry https://registry.npmjs.org

      - name: Audit public dependency graph and generate supply-chain inventory
        run: |
          npm run security:r08:audit
          npm run quality:r08

      - name: Lint
        run: |
          npm run quality:branding
          node scripts/run-eslint.js --quiet

      - name: Check Storybook interactions, language and a11y configuration
        run: |
          node scripts/check-storybook-interactions.js
          node scripts/check-storybook-language.js
          node scripts/check-storybook-quality-config.js

      - name: Validate CI quality contract
        run: npm run quality:ci:check

      - name: Build supported packages
        run: node scripts/run-supported-package-gate.js

      - name: Run DS-only tests
        run: node scripts/run-ds-only-tests.js

      - name: Build static Storybook
        run: node scripts/build-storybook-local.js

      - name: Audit component-to-story coverage
        run: node scripts/audit-component-story-coverage.js

      - name: Generate and validate documentation contracts
        run: |
          npm run docs:r09:generate
          npm run quality:r09
          npm run quality:agent-governance

      - name: Audit source policy
        working-directory: .
        run: node app/scripts/audit-github-source-snapshot.js

      - name: Validate GitHub readiness contract
        run: npm run quality:r10

      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovna-ui-storybook
          path: app/storybook-static
          if-no-files-found: error

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovna-ui-quality-reports
          path: |
            docs/component-story-coverage.json
            docs/q13-ci-quality-report.json
            docs/dependency-audit.json
            docs/dependency-license-inventory.json
            docs/sbom.cdx.json
            docs/r08-security-supply-chain.json
            docs/r08-security-supply-chain-gate.json
            docs/agent-context/ds-catalog.json
            docs/agent-governance-report.json
            docs/governance/artifact-inventory.json
            docs/r09-documentation-gate.json
            docs/r10-github-readiness.json
            docs/r10-commit-boundary.json
            docs/r10-github-ready-gate.json
            tmp/g05-storybook-static-build.json
            tmp/g07-supported-package-gate.json
            tmp/g10-ds-only-tests/report.json
            tmp/f17-github-snapshot-audit.json
          if-no-files-found: warn
          retention-days: 14

  browser-quality:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
      npm_config_registry: https://registry.npmjs.org
      Q_RUNTIME_CONCURRENCY: 4
      Q_RUNTIME_ENTRY_TIMEOUT: 15000
      Q_A11Y_CONCURRENCY: 8
      Q_LANGUAGE_CONCURRENCY: 6

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock
          registry-url: https://registry.npmjs.org

      - name: Activate Yarn 1
        run: corepack prepare yarn@1.22.15 --activate

      - name: Install public dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive --registry https://registry.npmjs.org

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Build static Storybook
        run: npm run build:storybook

      - name: Run full Chromium story suite
        run: npm run test:storybook:ci

      - name: Audit all Storybook entries at runtime
        run: npm run storybook:runtime:audit

      - name: Enforce deterministic network policy
        run: node scripts/check-storybook-network-policy.js --report-only

      - name: Run risk-based Firefox and WebKit suite
        run: npm run storybook:cross-browser

      - name: Audit accessibility
        run: npm run storybook:a11y:audit

      - name: Check accessibility warning baseline
        run: npm run storybook:a11y:baseline

      - name: Check visual and responsive baselines
        run: npm run storybook:visual:audit

      - name: Audit runtime language
        run: npm run storybook:language:runtime

      - name: Audit performance budgets
        run: npm run storybook:performance:audit

      - name: Summarize story flakiness
        if: always()
        run: npm run storybook:flakiness:check

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovna-ui-browser-quality-reports
          path: |
            docs/accessibility-full-report.json
            docs/q07-cross-browser-report.json
            docs/q08-runtime-language-report.json
            docs/q12-performance-report.json
            docs/q13-accessibility-baseline-check.json
            tmp/q01-browser-runner.json
            tmp/q02-story-render-report.json
            tmp/q03-storybook-browser-tests.json
            tmp/q05-visual-responsive-report.json
            tmp/q13-story-flakiness.json
            tmp/q05-visual-actual
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure screenshots, diffs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovna-ui-browser-failures
          path: |
            tmp/q02-story-render-failures
            tmp/q05-visual-failures
          if-no-files-found: ignore
          retention-days: 14

  release-rehearsal:
    needs: [quality, browser-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
      HUSKY: 0
      COREPACK_ENABLE_NETWORK: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
      npm_config_offline: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Activate Yarn 1
        run: corepack prepare yarn@1.22.15 --activate

      - name: Install public dependencies
        env:
          COREPACK_ENABLE_NETWORK: 1
          npm_config_offline: false
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive --registry https://registry.npmjs.org

      - name: Rehearse packages and isolated consumers
        run: npm run release:ds-only

      - name: Verify supported consumer profiles
        run: npm run consumers:ds-only -- --reuse-tarball

      - name: Verify React compatibility matrix
        env:
          COREPACK_ENABLE_NETWORK: 1
          npm_config_offline: false
          npm_config_registry: https://registry.npmjs.org
        run: npm run compatibility:react

      - name: Upload release rehearsal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovna-ui-release-rehearsal
          path: |
            tmp/f13-local-tarball-rehearsal/result.json
            tmp/g11-ds-only-release-rehearsal.json
            tmp/g12-ds-only-consumers/report.json
            docs/react-compatibility.json
            release
          if-no-files-found: warn
          retention-days: 14
